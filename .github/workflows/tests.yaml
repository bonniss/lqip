name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        # gd alone is what most shared hosting has. With imagick loaded, `auto`
        # resolves to it, so the same suite then exercises the other engine, and
        # the driver contract tests stop skipping it.
        extensions: ['gd', 'gd, imagick']

    name: PHP ${{ matrix.php }} (${{ matrix.extensions }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # The runner's GD includes WebP, which matters: without it the blur mode
          # silently falls back to JPEG and the size assertions would exercise a
          # different code path than the one the defaults describe.
          extensions: ${{ matrix.extensions }}
          coverage: none

      - name: Report engine capabilities
        run: php -r 'var_dump(gd_info()); if (extension_loaded("imagick")) { var_dump(Imagick::getVersion(), Imagick::queryFormats("WEBP")); }'

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
